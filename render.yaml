services:
  - type: web
    name: configurator
    runtime: node
    plan: starter          # free spins down after 15 min idle; starter stays warm
    region: singapore      # closest to Mumbai
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false        # paste the Neon pooled connection string
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false        # paste from aistudio.google.com/apikey
